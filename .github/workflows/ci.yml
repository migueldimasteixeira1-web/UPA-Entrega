name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upa
          POSTGRES_PASSWORD: upa_secret
          POSTGRES_DB: upa_entrega_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upa -d upa_entrega_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # bitnamilegacy/minio (não a imagem oficial minio/minio): "services:" do
      # GitHub Actions não permite sobrescrever o comando do container, e a
      # imagem oficial exige `server /data` como argumento pra subir — sem
      # isso ela só imprime o help e não escuta em lugar nenhum. A imagem da
      # bitnami já vem com um entrypoint que sobe o servidor sozinho.
      # "bitnami/minio" foi descontinuada (movida pro catálogo pago) — o
      # equivalente livre agora fica em "bitnamilegacy/*" (validado localmente
      # antes de subir esta correção).
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000

    env:
      TEST_DATABASE_URL: postgresql://upa:upa_secret@localhost:5432/upa_entrega_test?schema=public
      JWT_SECRET: ci_jwt_secret_not_for_production
      TEST_S3_ENDPOINT: http://localhost:9000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
