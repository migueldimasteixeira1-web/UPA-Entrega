services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sedom_entrega}
      POSTGRES_USER: ${POSTGRES_USER:-sedom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sedom} -d ${POSTGRES_DB:-sedom_entrega}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY no arquivo .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY no arquivo .env}
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sedom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sedom_entrega}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL no arquivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-sedom}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY no arquivo .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY no arquivo .env}
      # Opcionais — sem SMTP_HOST o e-mail só loga (nunca bloqueia a criação
      # do pedido); sem ORS_API_KEY o despacho cai pra ordem FIFO em vez de
      # otimizada. Ver docs/integracoes-externas.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
