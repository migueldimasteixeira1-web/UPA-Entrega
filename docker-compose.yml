services:
  db:
    image: postgres:16-alpine
    container_name: upa-entrega-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: upa
      POSTGRES_PASSWORD: upa_secret
      POSTGRES_DB: upa_entrega
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upa -d upa_entrega"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upa-entrega-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://upa:upa_secret@db:5432/upa_entrega?schema=public
      JWT_SECRET: upa_entrega_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 8h
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upa-entrega-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
