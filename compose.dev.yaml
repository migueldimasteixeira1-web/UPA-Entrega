# Desenvolvimento local com hot-reload (Docker).
# Uso: docker compose -f compose.dev.yaml up --build
services:
  db:
    image: postgres:16-alpine
    container_name: sedom-db-dev
    environment:
      POSTGRES_USER: sedom
      POSTGRES_PASSWORD: sedom_secret
      POSTGRES_DB: sedom_entrega
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedom -d sedom_entrega"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sedom-minio-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sedom-backend-dev
    environment:
      DATABASE_URL: postgresql://sedom:sedom_secret@db:5432/sedom_entrega?schema=public
      JWT_SECRET: sedom_jwt_secret_dev_only
      JWT_EXPIRES_IN: 8h
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_DEMO_DATA: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sedom
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Opcionais — vazios por padrão (mesmo comportamento de sempre: e-mail
      # só loga no console, otimização de rota cai pro FIFO). Pra testar de
      # verdade rodando a stack completa em Docker, exporte no shell antes
      # do `docker compose up` ou crie um `.env` na raiz do projeto (o
      # Compose lê automaticamente, independente do -f usado).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sedom-frontend-dev
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_dev_data:
  minio_dev_data:
