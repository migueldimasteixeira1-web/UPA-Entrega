# Desenvolvimento local com hot-reload (Docker).
# Uso: docker compose -f compose.dev.yaml up --build
services:
  db:
    image: postgres:16-alpine
    container_name: upa-entrega-db-dev
    environment:
      POSTGRES_USER: upa
      POSTGRES_PASSWORD: upa_secret
      POSTGRES_DB: upa_entrega
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upa -d upa_entrega"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: upa-entrega-minio-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: upa-entrega-backend-dev
    environment:
      DATABASE_URL: postgresql://upa:upa_secret@db:5432/upa_entrega?schema=public
      JWT_SECRET: upa_entrega_jwt_secret_dev_only
      JWT_EXPIRES_IN: 8h
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_DEMO_DATA: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: upa-entrega
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: upa-entrega-frontend-dev
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_dev_data:
  minio_dev_data:
